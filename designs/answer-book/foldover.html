<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · The Houston Answer Book fold-over</title>
<link rel="stylesheet" href="answer-book.css">
<script src="answer-book.js"></script>
<!--
  BrochureDesk · The Houston Answer Book · 11 x 17 fold-over
  11 x 17 sheet folded once down the middle: four upright 8.5 x 11 panels, 0.125 in (9 pt) bleed, 0.25 in safe zone.
    outside spread: back (left) + cover (right)        inside spread: front rooms (left) + bedrooms and baths (right)
  Every caption is a short buyer question about the house with a specific answer (pieces.json: caption_style "question").

  Modes (data.mode):
    proof  four panel pages, 8.75 x 11.25 in each (trim + bleed)
    print  two spreads, 17.25 x 11.25 in, each half clipped at the fold

  Blocks fill the page with flexbox: when a block is empty or the agent removes it (data.hidden), the blocks around it
  grow into the space. Text never shrinks to fit; an overflow is reported and goes back to the writer.
-->
<style>
  .hdr-logo{position:absolute;right:var(--m);top:9pt;height:28pt;width:170pt}
  .hdr-logo .word{font-size:11pt}
  .kick{position:absolute;left:var(--m);top:51pt;width:380pt}
  .ttl{position:absolute;left:var(--m);top:62pt}
  .flow{position:absolute;left:var(--m);right:var(--m);display:flex;flex-direction:column}
  .row{display:flex;gap:14pt;min-height:0}
  .item{display:flex;flex-direction:column;min-width:0;min-height:0}
  .item > .ph{flex:1 1 0}
  .vstack{display:flex;flex-direction:column;min-width:0;min-height:0}
  .hr{flex:none;height:.6pt;background:var(--line)}

  /* cover */
  .cover-photo{position:absolute;left:-9pt;top:-9pt;right:-9pt;height:454pt}
  .band{display:flex;align-items:stretch;gap:0;flex:none}
  .band .addr{width:318pt;flex:none}
  .band .loc{margin-top:4pt}
  .band .street{text-wrap:balance;font-family:var(--font-display);font-weight:500;font-size:31pt;line-height:36pt;letter-spacing:-.4pt;color:var(--ink);overflow:hidden;margin-top:5pt}
  .band .divide{width:.6pt;background:var(--line);margin:2pt 14pt 0 38pt;flex:none}
  .band .sum{flex:1;min-width:0}
  .band .sum .cap{padding-top:0}
  .statrow{flex:none;display:flex;justify-content:space-between;gap:10pt;border-top:.6pt solid var(--line);border-bottom:.6pt solid var(--line);padding:6.5pt 0 6pt;margin-top:10pt;overflow:hidden}
  .statrow div{font:600 9pt/11pt var(--font-body);color:var(--ink);white-space:nowrap;letter-spacing:.15pt}
  .foot{position:absolute;left:var(--m);right:var(--m);top:752pt;height:20pt;border-top:.6pt solid var(--line);display:flex;align-items:flex-end;justify-content:space-between}
  .foot .who{font:600 8pt/10pt var(--font-body);letter-spacing:1.2pt;text-transform:uppercase;color:var(--kicker);white-space:nowrap;overflow:hidden}
  .foot .logo{height:18pt;width:150pt}
  .foot .logo .word{font-size:10pt}

  /* floor plan */
  .plan{position:relative;flex:none}
  .plan svg{position:absolute;left:0;top:0}
  .plan .rl{position:absolute;text-align:center;font:600 6.5pt/7.5pt var(--font-body);letter-spacing:.6pt;text-transform:uppercase;color:var(--ink);overflow:hidden;padding:0 2pt}
  .plan .rl .n{display:block}
  .plan .rd{display:block;white-space:nowrap;font-weight:400;letter-spacing:.2pt;text-transform:none;color:var(--text)}
  .plan .rl.v{transform:rotate(-90deg)}
  .plan .note{position:absolute;width:190pt}
  .plan .note .t{font:600 8pt/10pt var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:var(--kicker)}
  .plan .note .d{font-size:8pt;line-height:10.5pt;color:var(--text);margin-top:3pt;overflow:hidden}

  /* back */
  .near{flex:none;border-top:.6pt solid var(--line);padding-top:9pt;margin-top:12pt}
  .near .q{font:600 8.5pt/11pt var(--font-body);color:var(--ink)}
  .near .cols{display:flex;margin-top:6pt}
  .near .c{flex:1;min-width:0;padding-left:12pt;border-left:.6pt solid var(--line)}
  .near .c:first-child{padding-left:0;border-left:0}
  .near .d{font:500 21pt/25pt var(--font-display);color:var(--ink);white-space:nowrap;overflow:hidden;letter-spacing:-.2pt}
  .near .p{font:600 8pt/10pt var(--font-body);letter-spacing:1.3pt;text-transform:uppercase;color:var(--kicker);white-space:nowrap;overflow:hidden;margin-top:2pt}
  .checkblock{flex:none;padding-top:9pt}
  .checkblock .lead{font-size:8.5pt;line-height:11.5pt;color:var(--text);margin:2pt 0 5pt;white-space:nowrap;overflow:hidden}
  .builtin{flex:none;border-top:.6pt solid var(--line);padding-top:9pt;margin-top:12pt}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>

<script>
window.brochureReady = (async function(){
  const D = AB.data();
  if(!D.listing){ document.getElementById('pages').innerHTML='<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const mode = D.mode || 'proof';
  const pt = px => px*72/96;
  const esc = AB.esc, L = D.listing, A = D.agent || {}, b = D.brand || {};
  const hidden = new Set(D.hidden || []);
  const issues = [];

  // fonts: originals unless the agent picked approved ones
  let spec = D.fontSpec;
  if(!spec){ try { spec = await fetch('fonts.json').then(r => r.json()); } catch(e) { spec = null; } }
  issues.push(...await AB.applyFonts(D, spec));

  // ---------- copy (or, in the free preview, photos in listing order with faint lines) ----------
  const C = autoCopy(D);
  function autoCopy(D){
    const c = D.copy || {};
    if(c.cover) return c;
    const ids = Object.keys(D.photos || {}).filter(id => AB.src(D, id));
    const rest = ids.length > 1 ? ids.slice(1) : ids; let k = 0;
    const p = () => ({photo: rest[k++ % Math.max(1, rest.length)]});
    const tiles = Math.max(2, Math.min(6, (L.beds||3) - 1 + (L.baths||2)));
    return {
      cover: {photo: ids[0], photos: [p(), p(), p()]},
      frontRooms: {photos: [p(), p(), p(), p()]},
      bedsBaths: {pair: [p(), p()], tiles: Array.from({length: tiles}, p)},
      outside: {exterior: p(), backyard: p(), small: [p(), p()], nearby: []},
      finePrint: (D.companion && D.companion.fineprint) || c.finePrint || ''
    };
  }
  const on = (id, v) => !hidden.has(id) && v != null && !(Array.isArray(v) && !v.length);

  const tabs = active => `<div class="tabs">${['Front rooms','Bedrooms and baths','Outside and nearby'].map((t,i)=>`<div class="tab${i===active?' on':''}">${t}</div>`).join('')}</div>`;
  const logo = (cls) => `<div class="logo ${cls}" data-area="${cls ? 2600 : 1150}" data-maxh="${cls ? 28 : 18}">${b.logo ? `<img src="${esc(b.logo)}" alt="">` : `<span class="word" data-slot="broker.name" data-lines="1">${esc(b.brokerage||'')}</span>`}</div>`;
  const kicker = (t, slot) => AB.pending(D, t) ? `<div class="kick">${AB.ghost(1, 10, 'width:40%')}</div>` : `<div class="abs kicker kick" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const title = (t, slot, w) => AB.pending(D, t) ? `<div class="ttl" style="width:${w}pt">${AB.ghost(1, 30, 'width:80%')}</div>` : `<div class="title ttl" style="width:${w}pt" data-slot="${slot}" data-lines="1">${esc(t)}</div>`;
  const intro = (t, slot, lines, style) => AB.pending(D, t) ? `<div style="flex:none;${style||''}">${AB.ghost(lines, 12)}</div>` : `<div class="intro" style="flex:none;height:${lines*12}pt;${style||''}" data-slot="${slot}" data-lines="${lines}">${esc(t)}</div>`;
  const item = (it, slot, lines, grow, style) => `<div class="item" style="flex:${grow||1} 1 0;${style||''}">${AB.photo(D, it && it.photo, '', slot)}${AB.caption(D, it, slot, lines)}</div>`;

  // ================= COVER =================
  function cover(){
    const K = C.cover || {};
    const summary = on('cover.summary', K.summary) || D.copyPending;
    const photos = on('cover.photos', K.photos) ? K.photos.slice(0,3) : [];
    const who = [A.name, A.title || A.designation].filter(Boolean).join(', ') + ((A.cell||A.phone) ? '  ·  ' + (A.cell||A.phone) : '');
    return `
      ${AB.photo(D, K.photo, 'position:absolute;left:-9pt;top:-9pt;right:-9pt;height:454pt', 'cover.photo')}
      <div class="flow" style="top:462pt;bottom:48pt;gap:0">
        <div class="band">
          <div class="addr"${summary ? '' : ' style="width:auto;flex:1"'}>
            <div class="kicker loc" data-slot="cover.location" data-lines="1">${esc(K.location || AB.place(L))}</div>
            <div class="street" data-slot="cover.address" data-lines="2" style="max-height:72pt">${esc(L.address)}</div>
          </div>
          ${summary ? `<div class="divide"></div><div class="sum">${AB.caption(D, K.summary, 'cover.summary', 4)}</div>` : ''}
        </div>
        <div class="statrow" data-slot="cover.stats" data-lines="1" style="white-space:nowrap">${AB.stats(L, K.stat5).map(s=>`<div>${esc(s)}</div>`).join('')}</div>
        ${photos.length ? `<div class="row" style="flex:1;margin-top:13pt">${photos.map((p,i)=>item(p, 'cover.photo'+i, 3)).join('')}</div>` : '<div style="flex:1"></div>'}
      </div>
      <div class="foot"><div class="who" data-slot="cover.agent" data-lines="1">${esc(who)}</div>${logo('')}</div>`;
  }

  // ================= INSIDE LEFT: FRONT ROOMS =================
  function frontRooms(){
    const F = C.frontRooms || {};
    const plan = on('front.plan', F.plan) && F.plan.rooms ? F.plan : null;
    const ph = (F.photos || []).filter(Boolean).slice(0, plan ? 4 : 6);
    const rows = [];
    for(let i=0;i<ph.length;i+=2) rows.push(ph.slice(i, i+2));
    const showIntro = on('front.intro', F.intro) || D.copyPending;
    return `${tabs(0)}${logo('hdr-logo')}
      ${kicker(F.kicker, 'front.kicker')}
      ${title(F.title, 'front.title', showIntro ? 384 : 554)}
      ${showIntro ? `<div class="abs" style="left:421pt;top:49pt;width:162pt">${AB.pending(D, F.intro) ? AB.ghost(4, 11.5) : `<div class="intro" style="font-size:8.5pt;line-height:11.5pt;height:46pt" data-slot="front.intro" data-lines="4">${esc(F.intro)}</div>`}</div>` : ''}
      <div class="flow" style="top:101pt;bottom:26pt;gap:12pt">
        ${rows.map((r,ri)=>`<div class="row" style="flex:1 1 0">${r.map((p,i)=>item(p, `front.photo${ri*2+i}`, 3)).join('')}${r.length===1 ? '<div class="item" style="flex:1 1 0"></div>' : ''}</div>`).join('')}
        ${plan ? planBlock(plan, 554, 246) : ''}
      </div>`;
  }

  // Redrawn floor plan: rooms as rectangles in the plan's own units, drawn in the design's colors, with dimensions.
  function planBlock(P, W, H){
    const s = Math.min(W / P.w, H / P.h), ox = 0, oy = (H - P.h*s)/2;
    const fill = {room:'#efe9dc', wet:'#dde6e6', outdoor:'url(#hatch)', garage:'#d8dcd8', closet:'#efe9dc', hall:'#efe9dc'};
    let svg = `<svg width="${W}pt" height="${H}pt" viewBox="0 0 ${W} ${H}"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#f4f1e9"/><line x1="0" y1="0" x2="0" y2="5" stroke="#bfc6c2" stroke-width="1"/></pattern></defs>`;
    let labels = '';
    for(const r of P.rooms){
      const x = ox + r.x*s, y = oy + r.y*s, w = r.w*s, h = r.h*s;
      const k = r.kind || 'room';
      svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill[k]||fill.room}" stroke="#22383a" stroke-width="${k==='outdoor'?0.5:0.8}"/>`;
      if(r.label){
        const vert = !!r.vertical;
        const lw = vert ? h : w, cx = x + w/2, cy = y + h/2;
        // room name may take two lines in a small room; the size line never wraps
        labels += `<div class="rl${vert?' v':''}" style="left:${cx - lw/2}pt;top:${cy}pt;width:${lw}pt" data-center="1"><span class="n" data-slot="front.plan.${esc(r.label)}" data-lines="2" data-fine="1">${esc(r.label)}</span>${r.dims ? `<span class="rd" data-slot="front.plan.${esc(r.label)}.dims" data-lines="1" data-fine="1">${esc(r.dims)}</span>` : ''}</div>`;
      }
    }
    for(const w of (P.walls||[])) svg += `<polyline points="${w.map(([x,y])=>`${ox+x*s},${oy+y*s}`).join(' ')}" fill="none" stroke="#22383a" stroke-width="3.2" stroke-linejoin="miter"/>`;
    for(const d of (P.doors||[])) svg += `<path d="M${ox+d.x*s},${oy+d.y*s} l${d.r*s*(d.dx||1)},0 a${d.r*s},${d.r*s} 0 0 ${d.sweep||0} ${-d.r*s*(d.dx||1)},${d.r*s*(d.dy||1)}" fill="none" stroke="#22383a" stroke-width=".5"/>`;
    svg += '</svg>';
    const corner = P.noteCorner || 'tr';
    const pos = {tr:'right:0;top:0', tl:'left:0;top:0', br:'right:0;bottom:0', bl:'left:0;bottom:0'}[corner];
    const note = AB.pending(D, P.note) ? `<div class="note" style="${pos}">${AB.ghost(3, 10.5)}</div>`
      : `<div class="note" style="${pos}"><div class="t">${esc(P.title || 'The floor plan')}</div><div class="d" style="height:31.5pt" data-slot="front.plan.note" data-lines="3">${esc(P.note)}</div></div>`;
    return `<div class="plan" style="height:${H}pt">${svg}${labels}${note}</div>`;
  }

  // ================= INSIDE RIGHT: BEDROOMS AND BATHS =================
  function bedsBaths(){
    const B = C.bedsBaths || {};
    const pair = (B.pair || []).filter(Boolean).slice(0, 2);
    const tiles = (B.tiles || []).filter(Boolean).slice(0, 9);
    const built = on('beds.builtIn', B.builtIn) ? B.builtIn : null;
    const showIntro = on('beds.intro', B.intro) || D.copyPending;
    const rows = AB.bestRows(pair, tiles, {W:554, gap:14, H:669 - (showIntro ? 12*(B.introLines||1)+10 : 0) - (built ? 52 : 0)});
    let k = 0;
    const html = rows.map(r => {
      const its = r.items.map((t, i) => item(t, t._slot, r.cols >= 4 ? 4 : 3, r.weights[i]));
      return `<div class="row" style="flex:${r.grow.toFixed(1)} 1 ${AB.CAP_EST}pt">${its.join('')}</div>`;
    }).join('');
    return `${tabs(1)}${logo('hdr-logo')}
      ${kicker(B.kicker, 'beds.kicker')}
      ${title(B.title, 'beds.title', 554)}
      <div class="flow" style="top:97pt;bottom:26pt;gap:12pt">
        ${showIntro ? intro(B.intro, 'beds.intro', B.introLines || 1, 'margin-bottom:-2pt') : ''}
        ${html}
        ${built ? `<div class="builtin"><div class="kicker">${esc(B.builtInTitle || 'Built in, and new')}</div>
          <div class="checks inline" style="margin-top:5pt;max-height:27pt" data-slot="beds.builtIn" data-lines="2">${built.map(t=>`<div>${esc(t)}</div>`).join('')}</div></div>` : ''}
      </div>`;
  }

  // ================= BACK: OUTSIDE AND NEARBY =================
  function outside(){
    const O = C.outside || {};
    const ext = on('outside.exterior', O.exterior) ? O.exterior : null;
    const yard = on('outside.backyard', O.backyard) ? O.backyard : null;
    const small = on('outside.small', O.small) ? O.small.slice(0, 2) : [];
    const list = on('outside.checklist', O.checklist) && O.checklist.items && O.checklist.items.length ? O.checklist : null;
    let call = on('outside.callout', O.callout) ? O.callout : null;
    if(call && call.kind === 'flood' && !AB.floodStated(L.description)){ issues.push({slot:'outside.callout', kind:'flood-not-stated', text:call.big}); call = null; }
    let near = on('outside.nearby', O.nearby) ? O.nearby.slice(0, 3) : [];
    near = [...near.filter(x => x.kind === 'hoa'), ...near.filter(x => x.kind !== 'hoa')];   // HOA amenities first

    // Two columns. Blocks are shared out so both columns fill with photos near a 3:2 shape: try every split
    // (photos first in a column, then the checklist, then the callout) and keep the best; the design's own split wins when close.
    const blocks = [];
    if(ext) blocks.push({t:'photo', it:ext, slot:'outside.exterior', w:270, home:'L', ord:0});
    if(small.length) blocks.push({t:'small', w:(270-14)/2, home:'R', ord:1});
    if(yard) blocks.push({t:'photo', it:yard, slot:'outside.backyard', w:270, home:'L', ord:2});
    if(list) blocks.push({t:'list', fixed: 34 + Math.ceil(list.items.length / (list.columns===1 ? 1 : 2)) * 15 + list.items.filter(x => x.length > 30).length * 6, home:'R', ord:3});
    if(call) blocks.push({t:'call', fixed:124, home:'R', ord:4});
    const avail = 604 - 101 - (near.length ? 82 : 0), CAP = 46, T = 1.5;
    let left = [], right = [], best = Infinity;
    for(let m = 0; m < (1 << blocks.length); m++){
      const L2 = blocks.filter((_,i) => !(m >> i & 1)), R2 = blocks.filter((_,i) => m >> i & 1);
      if(!L2.length || !R2.length) continue;
      let score = 0;
      for(const col of [L2, R2]){
        const g = col.filter(x => x.w), f = col.reduce((a,x) => a + (x.w ? CAP : x.fixed) + 12, -12);
        if(!g.length){ score = Infinity; break; }
        const k = (avail - f) / g.reduce((a,x) => a + x.w/T, 0);
        score = Math.max(score, k <= 0 ? Infinity : Math.abs(Math.log(1/k)));
      }
      if(blocks.every(x => (x.home === 'R') === R2.includes(x))) score -= 0.15;
      if(ext && R2.some(x => x.slot === 'outside.exterior')) score += 0.05;   // the front of the house reads first, top left
      if(score < best){ best = score; left = L2; right = R2; }
    }
    if(best === Infinity){ left = blocks; right = []; }
    [left, right].forEach(c => c.sort((a,b) => a.ord - b.ord));
    left = left.map(x => x.t === 'photo' ? Object.assign({}, x, {grow: x.w/T}) : x);
    right = right.map(x => x.t === 'photo' ? Object.assign({}, x, {grow: x.w/T}) : x);
    const colHTML = col => col.map((x,i) => {
      if(x.t === 'photo') return item(x.it, x.slot, 3, x.grow.toFixed(1));
      if(x.t === 'small') return `<div class="row" style="flex:${(x.w/1.5).toFixed(1)} 1 0">${small.map((s,j)=>item(s, 'outside.small'+j, 3)).join('')}</div>`;
      if(x.t === 'list') return `<div class="checkblock"${i ? ' style="border-top:.6pt solid var(--line)"' : ''}>
          <div class="cap" style="padding-top:0"><div class="q" data-slot="outside.checklist.q" data-lines="1"><i class="dash"></i>${esc(list.q)}</div></div>
          ${list.lead ? `<div class="lead" data-slot="outside.checklist.lead" data-lines="1">${esc(list.lead)}</div>` : '<div style="height:5pt"></div>'}
          <div class="checks" style="column-count:${list.columns===1 ? 1 : 2};max-height:${(list.maxLines||7)*14}pt" data-slot="outside.checklist" data-lines="${list.maxLines||7}">${list.items.map(t=>`<div>${esc(t)}</div>`).join('')}</div></div>`;
      if(x.t === 'call') return `<div class="callout" style="flex:0 0 112pt">
          <div class="cap on-dark" style="padding-top:0"><div class="q" data-slot="outside.callout.q" data-lines="1"><i class="dash"></i>${esc(call.q)}</div></div>
          <div class="big" style="max-height:58pt" data-slot="outside.callout.big" data-lines="2">${esc(call.big)}</div></div>`;
    }).join('');
    const nearHTML = near.length ? `<div class="near"><div class="q"><i class="dash"></i>${esc(O.nearbyQ || 'What is nearby?')}</div>
        <div class="cols">${near.map((x,i)=>`<div class="c"><div class="d" data-slot="outside.near${i}.dist" data-lines="1">${esc(x.dist)}</div><div class="p" data-slot="outside.near${i}.place" data-lines="1">${esc(x.place)}</div></div>`).join('')}</div></div>` : '';
    const fine = C.finePrint || (D.companion && D.companion.fineprint) || '';
    return `${tabs(2)}
      ${kicker(O.kicker, 'outside.kicker')}
      ${title(O.title, 'outside.title', 554)}
      <div class="flow" style="top:101pt;bottom:${792-604}pt;gap:0">
        <div class="row" style="flex:1 1 0;gap:14pt">
          <div class="vstack" style="flex:1 1 0;gap:12pt">${colHTML(left)}</div>
          ${right.length ? `<div class="vstack" style="flex:1 1 0;gap:12pt">${colHTML(right)}</div>` : ''}
        </div>
        ${nearHTML}
      </div>
      ${AB.card(D, {x:29, y:614, w:554, h:132, qr:66})}
      <div class="abs fine" style="left:var(--m);right:var(--m);top:757pt;height:15pt;border-top:0" data-slot="finePrint" data-lines="2" data-fine="1">${esc(fine)}</div>`;
  }

  // ---------- assemble ----------
  const panels = {front: cover(), left: frontRooms(), right: bedsBaths(), back: outside()};
  const panel = (h) => `<div class="panel">${h}</div>`;
  let html = '';
  if(mode === 'print'){
    html += `<div class="page" data-page="outside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.back)}</div><div class="half r">${panel(panels.front)}</div></div>`;
    html += `<div class="page" data-page="inside" style="width:1242pt;height:810pt"><div class="half l">${panel(panels.left)}</div><div class="half r">${panel(panels.right)}</div></div>`;
  } else {
    for(const id of ['front','left','right','back']) html += `<div class="page" data-page="${id}" style="width:630pt;height:810pt">${panel(panels[id])}</div>`;
  }
  document.getElementById('pages').innerHTML = html;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  // floor plan labels sit centered on their room, whatever lines they take
  document.querySelectorAll('.plan .rl[data-center]').forEach(el => el.style.top = (parseFloat(el.style.top) - pt(el.offsetHeight)/2) + 'pt');
  AB.equalizeRows();
  AB.fitLogos();
  issues.push(...AB.layoutCards());
  window.brochureCheck = () => AB.check(D, issues);

})();
