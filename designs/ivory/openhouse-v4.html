<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Ivory open house flyer · v4 Calendar tile</title>
<link rel="stylesheet" href="ivory.css">
<script src="ivory.js"></script>
<!--
  Ivory · Open House flyer v4 "Calendar tile" (trim 612 x 792 pt).
  A solid bar in the agent's accent color runs edge to edge across the top of the page with the label knocked out at
  28 pt tracked caps. Under it, a calendar tile framed in a 2 pt accent rule: the weekday, the day number at 124 pt in the
  accent color, the month at 26 pt, a hairline, the time at 20 pt bold, then the special-notes and refreshments lines. The hero sits beside
  the tile. Below: address and facts on one baseline, three captioned photos, and a slightly larger contact card.
-->
<style>
  .bar{position:absolute;background:var(--accent)}
  .ev-label{left:36pt;top:16pt;width:540pt;height:30pt;text-align:center;font-size:28pt;line-height:30pt;letter-spacing:4pt;font-weight:700;color:var(--paper)}
  .tile{position:absolute;left:36pt;top:80pt;width:220pt;height:280pt;border:2pt solid var(--accent)}
  .tl-wd{left:36pt;top:96pt;width:220pt;height:14pt;text-align:center;font-size:11pt;line-height:14pt;letter-spacing:2.4pt;color:var(--ink);font-weight:700}
  .tl-day{left:36pt;top:106pt;width:220pt;height:134pt;font-size:124pt;line-height:134pt;text-align:center;color:var(--accent)}
  .tl-mo{left:36pt;top:240pt;width:220pt;height:32pt;font-size:26pt;line-height:32pt;text-align:center}
  .tl-raw{left:42pt;top:120pt;width:208pt;height:120pt;font-size:26pt;line-height:34pt;text-align:center;white-space:normal;color:var(--accent)}
  .tl-hair{left:52pt;top:282pt;width:188pt;height:.8pt;background:var(--accent);opacity:.5;position:absolute}
  .tl-time{left:40pt;top:290pt;width:212pt;height:26pt;font:700 20pt/26pt var(--font-body);color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden}
  .ev-strip{position:absolute;left:36pt;width:540pt;background:var(--accent);opacity:.1}
  .tl-note{height:14pt;font:600 11pt/14pt var(--font-body);color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;letter-spacing:.1pt}
  .oh-strong{height:14pt;font:700 11pt/14pt var(--font-body);color:var(--accent);text-align:center;white-space:nowrap;overflow:hidden;letter-spacing:.1pt}
  .address{left:35pt;top:372pt;width:540pt;height:30pt;font-size:24pt;line-height:30pt}
  .placeline{left:36pt;top:406pt;width:300pt;height:9pt}
  .factline{left:336pt;top:404pt;width:240pt;height:11pt;font:600 8.5pt/11pt var(--font-body);color:var(--ink);text-align:right;white-space:nowrap;overflow:hidden;letter-spacing:.2pt}
  .fine{left:36pt;top:760pt;width:540pt;font-size:6pt;line-height:8pt;height:8pt;white-space:nowrap;color:var(--muted)}
</style>
</head>
<body data-mode="email">
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
Ivory.whenFonts(function(){
  const D = Ivory.data();
  if(!D.listing){ document.getElementById('pages').innerHTML='<p style="color:#fff;padding:20pt">No data injected.</p>'; return; }
  const esc = Ivory.esc, b = D.brand||{}, L = D.listing, C = D.companion||{};
  document.body.dataset.mode = D.mode||'email';
  Ivory.applyBrand(b);
  const O = Ivory.openHouse(D);
  const inset = ((D.mode||'email')==='print' && D.piece.print==='margin') ? (D.piece.margin||18) : 0;

  const ids = Ivory.photoOrder(D);
  const pick = (C.flyerPhotos && C.flyerPhotos.length>=4) ? C.flyerPhotos : ids;
  const [hero, s1, s2, s3] = pick;

  let h = '', drop = 0;
  // the label bar: field edge to field edge, top of the page down to 62 pt
  h += `<div class="bar" style="left:${inset}pt;top:${inset}pt;width:${612-2*inset}pt;height:${62-inset}pt"></div>`;
  h += `<div class="abs label ev-label" data-slot="oh.label" data-lines="1">${esc(O.label)}</div>`;
  // the tile
  h += `<div class="tile"></div>`;
  if(O.day){
    h += `<div class="abs label tl-wd" data-slot="oh.weekday" data-lines="1">${esc(O.weekday)}</div>`;
    h += `<div class="abs display tl-day" data-slot="oh.day" data-lines="1">${esc(O.day)}</div>`;
    h += `<div class="abs display tl-mo" data-slot="oh.month" data-lines="1">${esc(O.month)}</div>`;
  } else if(O.long){
    h += `<div class="abs display tl-raw" data-slot="oh.date" data-lines="3">${esc(O.long)}</div>`;
  } else h += Ivory.ghost(66, 130, 140, 2, 36);
  h += `<div class="tl-hair"></div>`;
  h += O.time ? `<div class="abs tl-time" data-slot="oh.time" data-lines="1">${esc(O.time)}</div>` : '';
  { const ls = [[O.note,'oh.note','oh-strong'],[O.refreshments,'oh.refreshments','tl-note']].filter(l=>l[0]);
    // the date and time sit centered in the tile; special notes and refreshments go on a strip under the tile and hero
    h += `<style>.tl-wd,.tl-day,.tl-mo,.tl-raw,.tl-hair,.tl-time{margin-top:16pt}</style>`;
    if(ls.length){
      const ev = Ivory.eventLines(ls, 48, 373, 516, 14, 0, 'text-align:center');
      drop = ev.h + 18;
      h += `<div class="ev-strip" style="top:368pt;height:${ev.h+10}pt"></div>` + ev.html;
    } }
  // hero beside the tile (narrower than the photo, so only the sides crop; the roofline stays)
  h += Ivory.photo(D, '', hero, 'left:272pt;top:80pt;width:304pt;height:280pt');

  if(drop) h += `<style>.address{top:${372+drop}pt}.placeline{top:${406+drop}pt}.factline{top:${404+drop}pt}</style>`;
  h += `<div class="abs display address" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="abs place placeline" data-slot="place" data-lines="1" data-fine="1">${esc(Ivory.place(L))}</div>`;
  h += `<div class="abs factline" data-slot="oh.facts" data-lines="1">${esc(Ivory.factsShort(L))}</div>`;
  h += `<div class="hair" style="left:36pt;top:${422+drop}pt;width:540pt;opacity:.35"></div>`;
  [[s1,36],[s2,221],[s3,406]].forEach(([id,x],i)=> h += Ivory.photo(D, '', id, `left:${x}pt;top:${432+drop}pt;width:170pt;height:${150-drop}pt`) + Ivory.captionHTML(D, id, x, 586, 170, 'row'+i));

  h += Ivory.card(D, {x:36, y:636, w:540, h:118, nameSize:30, phoneSize:18, lineSize:8.5, officeSize:13, qr:62, logoH:32, gap:18, brkMin:190,
                      top:{name:9, title:46, callLbl:59, phone:67}});
  h += `<div class="abs fine" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;

  const f = Ivory.frame(D, 612, 792, h);
  document.getElementById('pages').innerHTML = f.html;
  Ivory.shapeLogos();
  window.pieceSize = {W:f.W, H:f.H, bleed:f.bleed};
  const cardIssues = Ivory.layoutCards();
  window.brochureCheck = () => Ivory.check(cardIssues);
});
</script>
</body>
</html>
