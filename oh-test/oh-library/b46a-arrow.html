<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Arrow</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Arrow (from reference B46, version A). Trim 612 x 792 pt. REALTOR(R) or public.
  The owner liked this as a unique concept and asked for a couple of versions. The page is the brand's dark color; the house
  sits in a five-sided shape pointing right, with the same shape drawn again in the accent color just behind it, and
  a narrow tab of the main color down the left edge carries the neighborhood. The shape is used only when the house
  box proves the point misses the house; otherwise the photo keeps square corners. Event on the left under the photo,
  address, facts and the writer's paragraph on the right.
  Type: Jost throughout.
-->
<style>
  .sheet{background:var(--dark);color:var(--on-dark)}
  .tab{position:absolute;left:0;top:0;width:30pt;height:792pt;background:var(--main)}
  .tabt{position:absolute;left:15pt;top:396pt;width:700pt;height:14pt;margin-left:-350pt;margin-top:-7pt;transform:rotate(-90deg);font:600 9pt/14pt Jost;letter-spacing:4pt;text-transform:uppercase;text-align:center;white-space:nowrap;color:var(--on-main)}
  .hl{font:600 36pt/38pt Jost;letter-spacing:1.5pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .date{font:500 28pt/34pt Jost;white-space:nowrap;overflow:hidden}
  .time{font:600 19pt/24pt Jost;letter-spacing:1pt;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--accent-on-dark)}
  .ev{font:400 10pt/13pt Jost;opacity:.92}
  .addr{font:600 22pt/26pt Jost}
  .place{font:500 9pt/12pt Jost;letter-spacing:2pt;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--accent-on-dark)}
  .facts{font:500 12.5pt/16pt Jost;white-space:nowrap;overflow:hidden}
  .body{font:400 11pt/15.5pt Jost;opacity:.9}
  .vr{position:absolute;width:.8pt;background:var(--on-dark);opacity:.3}
  .hr{position:absolute;left:54pt;width:522pt;height:.8pt;background:var(--on-dark);opacity:.3}
  .oh-agent-name{font-family:Jost;font-weight:600}
  .oh-agent{font-family:Jost}
  .fine{font:400 6.6pt/8pt Jost;white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['600 10pt Jost', '500 10pt Jost', '400 10pt Jost'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  let h = '';
  h += `<div class="tab"></div><div class="tabt" data-slot="place.tab" data-lines="1">${esc(OHL.place(L))}</div>`;
  // the house in an arrow, its accent echo just behind
  const fx = 54, fy = 40, fw = 540, fh = Math.max(360, OHL.minFrameH(D, hero, 540, 360));
  const arrow = [[0,0],[.9,0],[1,.5],[.9,1],[0,1],[.1,.5]];   // a shallow point and a notched tail, both clear of most front shots
  const shaped = OHL.polyFits(D, hero, fw, fh, arrow);
  if(shaped){
    const pts = arrow.map(([x,y]) => `${(fx + 12 + x*fw)*4/3},${(fy + 12 + y*fh)*4/3}`).join(' ');
    h += `<svg class="abs" style="left:0;top:0;width:612pt;height:${fy+fh+16}pt" viewBox="0 0 816 ${(fy+fh+16)*4/3}"><polygon points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
    h += OHL.maskedPhoto(D, hero, `left:${fx}pt;top:${fy}pt;width:${fw}pt;height:${fh}pt`, arrow);
  } else h += OHL.photo(D, hero, `left:${fx}pt;top:${fy}pt;width:${fw}pt;height:${fh}pt`);

  // event left
  let y = fy + fh + 30;
  const mid0 = h.length;
  const top0 = y, lines = OHL.labelLines(E.label);
  lines.forEach((t, i) => h += `<div class="abs hl" style="left:54pt;top:${y + i*38}pt;width:262pt;height:40pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  y += lines.length*38 + 14;
  h += `<div class="abs date" style="left:54pt;top:${y}pt;width:262pt;height:34pt" data-fit="28,20" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  y += 36;
  if(E.time){ h += `<div class="abs time" style="left:54pt;top:${y}pt;width:262pt;height:24pt" data-fit="19,18" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`; y += 30; }
  const ev = Ivory.eventLines([[E.note,'oh.note','ev'],[E.refreshments,'oh.refreshments','ev']], 54, y + 4, 262, 13, 3);
  h += ev.html; y += ev.h + 4;
  // address, facts, the writer's paragraph right
  const rx = 344, rw = 232;
  let ry = top0 + 2;
  const an = Ivory.linesNeeded('addr', L.address, rw, 26);
  h += `<div class="abs addr" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:${an*26+4}pt" data-slot="address" data-lines="${an}">${esc(L.address)}</div>`;
  ry += an*26 + 4;
  h += `<div class="abs place" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:12pt" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  ry += 18;
  h += `<div class="abs facts" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:16pt" data-slot="oh.facts" data-lines="1">${esc(Ivory.factsShort(L).replace(/  \/  /g, '  ·  '))}</div>`;
  ry += 26;
  // the writer's own sentences fill the rest of the column, set larger (owner 10/28/2026)
  const cy = 704, bBottom = Math.min(cy - 34, Math.max(y, top0 + 210)), wu = OHL.writeup(D, 'body', rw, 15.5, Math.floor((bBottom - ry)/15.5));
  if(wu.text){ h += `<div class="abs body" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:${wu.n*15.5+4}pt" data-slot="listing.body" data-lines="${wu.n}">${esc(wu.text)}</div>`; ry += wu.n*15.5; }
  h += `<div class="vr" style="left:326pt;top:${top0+4}pt;height:${Math.max(y, ry) - top0 - 2}pt"></div>`;
  const issues = y > cy - 18 ? [{slot:'oh.note', kind:'overflow', detail:'the event runs into the agent card'}] : [];
  const shift = Math.max(0, Math.min(40, (cy - 18 - Math.max(y, ry))/2));   // the block sits centered in what is left
  h = h.slice(0, mid0) + `<div class="abs" style="left:0;top:${shift}pt;width:612pt;height:0">` + h.slice(mid0) + `</div>`;
  h += `<div class="hr" style="top:${cy - 12}pt"></div>`;
  h += OHL.contact(D, {x:54, y:cy, w:522, h:62, tone:'dark', nameSize:18, phoneSize:13, lineSize:9.5, logoW:180, logoH:50});
  h += `<div class="abs fine" style="left:54pt;top:778pt;width:522pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  f.after = () => OHL.stack([...document.querySelectorAll('.hl')], 36, 22, top0, 1.05);
  return f;
});
</script>
</body>
</html>
