<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Tasting Table</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Tasting Table (from reference B13). Trim 612 x 792 pt. REALTOR(R) / broker opens with refreshments.
  The owner liked the food photo as the top and nothing after it, so everything below is rebuilt. The matching food photo
  (assets/food, by refreshment type) fills the top third under a dark wash; the invitation sits on it: the agent's
  event wording, the refreshment, and the date and time large. Below, on paper: the house at 3:2 beside the address and
  the event details, a row of three rooms, and the agent and logo. With no food photo the house photo takes the top.
  Type: Newsreader (headline, date, address), Instrument Sans (details).
-->
<style>
  .sheet{background:var(--paper);color:var(--ink)}
  .wash{position:absolute;left:0;top:0;width:612pt;background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.25) 45%, rgba(0,0,0,.72))}
  .top{color:#fff;text-shadow:0 1pt 3pt rgba(0,0,0,.45)}
  .ev.top{font:500 12pt/16pt 'Instrument Sans'}
  .eyebrow{font:500 10pt/13pt 'Instrument Sans';letter-spacing:4pt;text-transform:uppercase;white-space:nowrap}
  .hl{font:500 40pt/46pt Newsreader;white-space:nowrap;overflow:hidden}
  .rt{font:italic 500 24pt/30pt Newsreader;white-space:nowrap;overflow:hidden}
  .date{font:600 28pt/34pt Newsreader;white-space:nowrap;overflow:hidden}
  .time{font:600 19pt/24pt 'Instrument Sans';letter-spacing:.6pt;white-space:nowrap;overflow:hidden}
  .k{font:600 8.8pt/11pt 'Instrument Sans';letter-spacing:2.2pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap}
  .addr{font:500 22pt/26pt Newsreader}
  .place{font:400 9.5pt/13pt 'Instrument Sans'}
  .ev{font:400 10.5pt/14pt 'Instrument Sans'}
  .ev.b{font-weight:600}
  .rule{position:absolute;height:.9pt;background:var(--ink);opacity:.22}
  .oh-agent-name{font-family:Newsreader;font-weight:600}
  .oh-agent{font-family:'Instrument Sans'}
  .fine{font:400 6.6pt/8pt 'Instrument Sans';white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['500 10pt Newsreader', '600 10pt Newsreader', 'italic 500 10pt Newsreader', '400 10pt "Instrument Sans"', '500 10pt "Instrument Sans"', '600 10pt "Instrument Sans"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const food = Object.keys(D.photos||{}).find(id => /^food\b/i.test(D.photos[id].tags||''));
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id)).slice(0, 3);
  let h = '';
  // the top: the food photo under a dark wash, the invitation on it
  const TH = 300;
  if(food) h += OHL.photo(D, food, `left:0;top:0;width:612pt;height:${TH}pt`);
  else { const fr = OHL.fitHero(D, hero, 612, TH); h += `<div class="abs" style="left:0;top:0;width:612pt;height:${TH}pt;background:var(--dark)"></div>` + OHL.photo(D, hero, `left:${(612-fr.w)/2}pt;top:0;width:${fr.w}pt;height:${TH}pt`); }
  h += `<div class="wash" style="height:${TH}pt"></div>`;
  let y = 34;
  h += `<div class="abs top eyebrow" style="left:40pt;top:${y}pt;width:532pt;height:13pt">You're invited</div>`;
  y += 18;
  h += `<div class="abs top hl" style="left:38pt;top:${y}pt;width:536pt;height:46pt" data-fit="40,24" data-slot="oh.label" data-lines="1">${esc(E.label)}</div>`;
  y += 48;
  const rtext = E.refreshTitle || E.refreshText;
  // the refreshment type as a title; the agent's own line under it (or alone, in the same italic, when there is no type)
  if(E.refreshTitle){ h += `<div class="abs top rt" style="left:40pt;top:${y}pt;width:532pt;height:30pt" data-fit="24,16" data-slot="oh.refreshTitle" data-lines="1">${esc(E.refreshTitle + (E.refreshText ? ':' : ''))}</div>`; y += 32; }
  else if(E.refreshText){ const n = Ivory.linesNeeded('rt', E.refreshText, 532, 30);
    h += `<div class="abs top rt" style="left:40pt;top:${y}pt;width:532pt;height:${n*30+4}pt;white-space:normal" data-slot="oh.refreshments" data-lines="${n}">${esc(E.refreshText)}</div>`; y += n*30 + 2; }
  if(E.refreshTitle && E.refreshText){ const n = Ivory.linesNeeded('ev top', E.refreshText, 400, 16);
    h += `<div class="abs top ev" style="left:40pt;top:${y}pt;width:400pt;height:${n*16+3}pt" data-slot="oh.refreshments" data-lines="${n}">${esc(E.refreshText)}</div>`; y += n*16; }
  h += `<div class="abs top date" style="left:40pt;top:${TH-80}pt;width:532pt;height:34pt" data-fit="28,22" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  if(E.time) h += `<div class="abs top time" style="left:40pt;top:${TH-44}pt;width:532pt;height:24pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  const issues = y > TH - 88 ? [{slot:'oh.refreshments', kind:'overflow', detail:'the refreshment lines run into the date'}] : [];
  // below: the house beside the address and the details
  y = TH + 24;
  const pw = 300, ph = Math.max(200, OHL.minFrameH(D, hero, pw, 200));
  const shown = food ? hero : null;
  if(shown) h += OHL.photo(D, shown, `left:36pt;top:${y}pt;width:${pw}pt;height:${ph}pt`);
  const rx = shown ? 36 + pw + 20 : 36, rw = 576 - rx;
  let ry = y;
  h += `<div class="abs k" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:11pt">Join us at</div>`; ry += 16;
  const an = Ivory.linesNeeded('addr', L.address, rw, 26);
  h += `<div class="abs addr" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:${an*26+5}pt" data-slot="address" data-lines="${an}">${esc(L.address)}</div>`; ry += an*26 + 4;
  const pl = [L.neighborhood, [L.city, L.state].filter(Boolean).join(', ')].filter(Boolean).join(', ');
  h += `<div class="abs place" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:13pt;white-space:nowrap;overflow:hidden" data-slot="place" data-lines="1">${esc(pl)}</div>`; ry += 15;
  h += `<div class="abs place" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:13pt;white-space:nowrap;overflow:hidden" data-slot="oh.facts" data-lines="1">${esc(Ivory.factsShort(L).replace(/  \/  /g, '  ·  '))}</div>`; ry += 24;
  if(E.note){
    h += `<div class="rule" style="left:${rx}pt;top:${ry - 8}pt;width:${rw}pt"></div>`;
    h += `<div class="abs k" style="left:${rx}pt;top:${ry}pt;width:${rw}pt;height:11pt">Good to know</div>`; ry += 15;
    const ev = Ivory.eventLines([[E.note,'oh.note','ev b']], rx, ry, rw, 14); h += ev.html; ry += ev.h;
  }
  const blockEnd = Math.max(y + (shown ? ph : 0), ry);
  // three rooms
  const gy = blockEnd + 16, rh = Math.min(170, 684 - gy), gw = (540 - 20)/3;
  if(rh >= 70) rooms.forEach((id, i) => h += OHL.photo(D, id, `left:${36 + i*(gw+10)}pt;top:${gy}pt;width:${gw}pt;height:${rh}pt`));
  if(ry > 690) issues.push({slot:'oh.note', kind:'overflow', detail:'the details run into the agent card'});
  h += `<div class="rule" style="left:36pt;top:696pt;width:540pt"></div>`;
  h += OHL.contact(D, {x:36, y:706, w:540, h:62, tone:'light', nameSize:18, phoneSize:13, lineSize:9.5, logoW:180, logoH:50});
  h += `<div class="abs fine" style="left:36pt;top:778pt;width:540pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  return f;
});
</script>
</body>
</html>
