<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Archway</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Archway (from reference P12). Trim 612 x 792 pt. Public or REALTOR(R).
  The owner liked the colors but wasn't sure about the curves and circles, so they're quieter here: one arched room photo
  (rooms only, so the arch never touches the house), two rounded-corner room photos instead of circles, and the house
  at its own shape. The page is a soft tint of the agent's main color, a dark band carries the address, date and time.
  Type: Josefin Sans.
-->
<style>
  .sheet{color:var(--ink)}
  .hl{font:400 50pt/52pt 'Josefin Sans';letter-spacing:2pt;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--main-on-paper)}
  .li{position:absolute;display:flex;align-items:center;gap:8pt;font:600 11pt/14pt 'Josefin Sans';white-space:nowrap;overflow:hidden}
  .li i{display:block;width:5pt;height:5pt;border-radius:50%;background:var(--accent);flex:none}
  .photo.rr{border-radius:14pt}
  .band{position:absolute;left:0;width:612pt;background:var(--dark);color:var(--on-dark)}
  .band~.on{color:var(--on-dark)}
  .k{font:600 9pt/12pt 'Josefin Sans';letter-spacing:3pt;text-transform:uppercase;white-space:nowrap;color:var(--accent-on-dark)}
  .addr{font:600 18pt/22pt 'Josefin Sans'}
  .place{font:400 10pt/13pt 'Josefin Sans';letter-spacing:1pt;white-space:nowrap;overflow:hidden}
  .date{font:700 24pt/30pt 'Josefin Sans';white-space:nowrap;overflow:hidden;text-align:right}
  .time{font:600 18pt/23pt 'Josefin Sans';white-space:nowrap;overflow:hidden;text-align:right;color:var(--accent-on-dark)}
  .ev{font:400 10pt/13pt 'Josefin Sans'}
  .oh-agent-name{font-family:'Josefin Sans';font-weight:700}
  .oh-agent{font-family:'Josefin Sans'}
  .fine{font:400 6.6pt/8pt 'Josefin Sans';white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['400 10pt "Josefin Sans"', '600 10pt "Josefin Sans"', '700 10pt "Josefin Sans"'], D => {
  const esc = Ivory.esc, L = D.listing, C = D.companion || {}, k = OHL.colors(D);
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id));
  let h = `<div class="abs" style="left:0;top:0;width:612pt;height:792pt;background:${OHL.mix(k.main, '#ffffff', .86)}"></div>`;
  // the arched room photo at left
  const ax = 36, aw = 250, ah = 330;
  h += OHL.photo(D, rooms[0], `left:${ax}pt;top:36pt;width:${aw}pt;height:${ah}pt;border-radius:${aw/2}pt ${aw/2}pt 0 0`);
  // headline and facts at right
  const lines = OHL.labelLines(E.label);
  const rx = 310, rw = 266;
  lines.forEach((t, i) => h += `<div class="abs hl" style="left:${rx}pt;top:${44 + i*52}pt;width:${rw}pt;height:56pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  const fy = 44 + lines.length*52 + 16;
  const facts = [...Ivory.facts(L)].filter(Boolean).slice(0, 4);
  facts.forEach((t, i) => h += `<div class="li" style="left:${rx+2}pt;top:${fy + i*20}pt;width:${rw}pt;height:16pt"><i></i><span data-slot="fact.${i}" data-lines="1">${esc(t)}</span></div>`);
  // two rounded room photos under the facts
  const sy = fy + facts.length*20 + 14, sh = 36 + ah - sy, sw = (rw - 12)/2;
  if(sh >= 80) rooms.slice(1, 3).forEach((id, i) => h += OHL.photo(D, id, `left:${rx + i*(sw+12)}pt;top:${sy}pt;width:${sw}pt;height:${sh}pt`, 'rr'));
  // the house below at its own shape
  const ev = Ivory.eventLines([[E.note,'oh.note','ev'],[E.refreshments,'oh.refreshments','ev']], 36, 0, 540, 13, 2);
  const bandH = 96 + (ev.h ? ev.h + 8 : 0), bandTop = 700 - 12 - bandH;
  const hy = 36 + ah + 14, hh = bandTop - 14 - hy;
  const fr = OHL.fitHero(D, hero, 540, Math.max(hh, 120));
  h += OHL.photo(D, hero, `left:${306 - fr.w/2}pt;top:${hy}pt;width:${fr.w}pt;height:${fr.h}pt`, 'rr');
  // the band
  h += `<div class="band" style="top:${bandTop}pt;height:${bandH}pt"></div>`;
  let y = bandTop + 16;
  h += `<div class="abs on k" style="left:36pt;top:${y}pt;width:270pt;height:12pt">You're invited to</div>`;
  const an = Ivory.linesNeeded('addr', L.address, 270, 22);
  h += `<div class="abs on addr" style="left:36pt;top:${y+16}pt;width:270pt;height:${an*22+4}pt" data-slot="address" data-lines="${an}">${esc(L.address)}</div>`;
  // city, state and ZIP at the street's size (owner 10/27/2026)
  h += `<div class="abs on addr" style="left:36pt;top:${y+16+an*22}pt;width:270pt;height:22pt;white-space:nowrap;overflow:hidden" data-slot="place" data-lines="1">${esc(OHL.place(L))}</div>`;
  h += `<div class="abs on date" style="left:316pt;top:${y+6}pt;width:260pt;height:30pt" data-fit="24,18" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  if(E.time) h += `<div class="abs on time" style="left:316pt;top:${y+38}pt;width:260pt;height:23pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  if(ev.h) h += ev.html.replace(/top:(\d+(\.\d+)?)pt/g, (m, t) => `top:${+t + bandTop + 86}pt`).replace(/class="abs ev"/g, 'class="abs on ev"');
  const issues = hh < 140 ? [{slot:'oh.note', kind:'overflow', detail:'the house photo is squeezed too small'}] : [];
  h += OHL.contact(D, {x:36, y:704, w:540, h:62, tone:'light', nameSize:17, phoneSize:13, lineSize:9.5, logoW:176, logoH:50});
  h += `<div class="abs fine" style="left:36pt;top:778pt;width:540pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  f.after = () => OHL.stack([...document.querySelectorAll('.hl')], 50, 26, 44, 1.04);
  return f;
});
</script>
</body>
</html>
