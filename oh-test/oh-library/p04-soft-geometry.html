<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Soft Geometry</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Soft Geometry (from reference P04), in the agent's and brokerage's colors as the owner asked. Trim 612 x 792 pt.
  Public or REALTOR(R). The dark brand color holds the event wording large at top; the house sits below at its own
  shape. Under it, angled blocks (never over the photo): a pale block with the date and time and a "hosted by" agent
  card, an accent wedge at right with the address, and the logo on the dark foot.
  Type: Urbanist.
-->
<style>
  .sheet{background:var(--dark);color:var(--on-dark)}
  .eyebrow{font:600 10pt/13pt Urbanist;letter-spacing:3.5pt;text-transform:uppercase;white-space:nowrap;opacity:.9}
  .hl{font:700 58pt/58pt Urbanist;letter-spacing:-1pt;white-space:nowrap;overflow:hidden}
  .burst{position:absolute;color:var(--accent-on-dark)}
  .pale{position:absolute;background:var(--paper);color:var(--ink)}
  .date{font:700 28pt/34pt Urbanist;white-space:nowrap;overflow:hidden}
  .time{font:600 19pt/23pt Urbanist;white-space:nowrap;overflow:hidden;color:var(--main-on-paper)}
  .ev{font:500 10pt/13pt Urbanist}
  .host{font:700 8.6pt/11pt Urbanist;letter-spacing:2pt;text-transform:uppercase;color:var(--main-on-paper);white-space:nowrap}
  .wedge{position:absolute;background:var(--accent);color:var(--on-accent)}
  .addr{font:700 17pt/21pt Urbanist;text-align:right}
  .place{font:600 9pt/12pt Urbanist;letter-spacing:1.6pt;text-transform:uppercase;text-align:right;white-space:nowrap;overflow:hidden}
  .oh-agent-name{font-family:Urbanist;font-weight:700}
  .oh-agent{font-family:Urbanist}
  .fine{font:500 6.6pt/8pt Urbanist;white-space:nowrap;opacity:.65}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt Urbanist', '600 10pt Urbanist', '500 10pt Urbanist'], D => {
  const esc = Ivory.esc, L = D.listing, A = D.agent || {}, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  let h = '';
  // event on the dark field, a small accent burst beside it
  h += `<div class="abs eyebrow" style="left:40pt;top:36pt;width:400pt;height:13pt">You're invited to an</div>`;
  const lines = OHL.labelLines(E.label);
  lines.forEach((t, i) => h += `<div class="abs hl" style="left:38pt;top:${54 + i*58}pt;width:440pt;height:62pt" data-slot="oh.label" data-lines="1">${esc(t)}</div>`);
  const rays = [...Array(16)].map((_, i) => { const a = i*Math.PI/8; return `<line x1="${30+9*Math.cos(a)}" y1="${30+9*Math.sin(a)}" x2="${30+27*Math.cos(a)}" y2="${30+27*Math.sin(a)}"/>`; }).join('');
  h += `<svg class="burst" style="left:500pt;top:70pt;width:60pt;height:60pt" viewBox="0 0 60 60"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${rays}</g></svg>`;
  const hb = 54 + lines.length*58 + 14;
  // the house
  const fr = OHL.fitHero(D, hero, 612, 300), py = hb;
  h += OHL.photo(D, hero, `left:${(612 - fr.w)/2}pt;top:${py}pt;width:${fr.w}pt;height:${fr.h}pt`);
  // angled blocks under the photo
  const by = py + fr.h, bh = 690 - by;
  const P = 4/3;
  h += `<svg class="abs" style="left:0;top:${by}pt;width:612pt;height:${bh}pt" viewBox="0 0 816 ${bh*P}" preserveAspectRatio="none">
    <polygon points="0,0 ${430*P},0 ${380*P},${bh*P} 0,${bh*P}" fill="var(--paper)"/>
    <polygon points="${440*P},0 816,0 816,${bh*P} ${392*P},${bh*P}" fill="var(--accent)"/></svg>`;
  let y = by + 18;
  h += `<div class="abs pale" style="left:0;top:0;width:0;height:0"></div>`;
  h += `<div class="abs date" style="left:40pt;top:${y}pt;width:330pt;height:34pt;color:var(--ink)" data-fit="28,20" data-slot="oh.date" data-lines="1">${esc(E.long)}</div>`;
  if(E.time) h += `<div class="abs time" style="left:40pt;top:${y+34}pt;width:330pt;height:23pt" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  y += 64;
  const ev = Ivory.eventLines([[E.note,'oh.note','ev'],[E.refreshments,'oh.refreshments','ev']], 40, y, 320, 13, 2, 'color:var(--ink)');
  h += ev.html; y += ev.h + (ev.h ? 10 : 2);
  const issues = y > 690 - 6 ? [{slot:'oh.note', kind:'overflow', detail:'the event lines run off the pale block'}] : [];
  // address on the accent wedge
  const an = Ivory.linesNeeded('addr', L.address, 160, 21);
  h += `<div class="abs addr" style="left:416pt;top:${by + 22}pt;width:160pt;height:${an*21+4}pt;color:var(--on-accent)" data-slot="address" data-lines="${an}">${esc(L.address)}</div>`;
  h += `<div class="abs place" style="left:416pt;top:${by + 26 + an*21}pt;width:160pt;height:12pt;color:var(--on-accent)" data-slot="place" data-lines="1">${esc([L.neighborhood, L.city].filter(Boolean).join('  ·  '))}</div>`;
  Ivory.facts(L).map(t => t.replace(' square feet', ' sq ft')).forEach((t, i) => h += `<div class="abs place" style="left:416pt;top:${by + 46 + an*21 + i*14}pt;width:160pt;height:13pt;color:var(--on-accent);letter-spacing:.8pt" data-slot="fact.${i}" data-lines="1">${esc(t)}</div>`);
  // foot: the agent card with the logo on the dark field
  h += OHL.contact(D, {x:40, y:700, w:536, h:62, tone:'dark', nameSize:18, logoW:180, logoH:50, nameFont:'Urbanist', nameWeight:700, bodyFont:'Urbanist'});
  h += `<div class="abs fine" style="left:40pt;top:776pt;width:536pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  f.after = () => OHL.stack([...document.querySelectorAll('.hl')], 58, 32, 54, 1.0);
  return f;
});
</script>
</body>
</html>
