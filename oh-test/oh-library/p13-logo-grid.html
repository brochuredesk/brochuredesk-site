<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrochureDesk · Open house library · Logo Grid</title>
<link rel="stylesheet" href="ohlib.css">
<script src="../ivory/ivory.js"></script>
<script src="ohlib.js"></script>
<!--
  Logo Grid (from reference P13). Trim 612 x 792 pt. Public or REALTOR(R).
  The owner: instead of the price, put the broker's logo. A large house photo in a white mat, an inset room photo overlapping
  its corner, the agent's headshot when there is one, and the brokerage logo in a ruled box where the price was. A band
  of the main color at the foot: the event wording with the weekday big, the address, and the date and time at right.
  Type: Red Hat Display.
-->
<style>
  .sheet{background:var(--paper);color:var(--ink)}
  .mat{position:absolute;background:#fff;box-shadow:0 2pt 8pt rgba(0,0,0,.18)}
  .lbox{position:absolute;background:#fff;border:1.6pt solid var(--dark)}
  .band{position:absolute;left:0;width:612pt;background:var(--main);color:var(--on-main)}
  .band~.on{color:var(--on-main)}
  .lab{font:700 22pt/26pt 'Red Hat Display';letter-spacing:4pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .wd{font:700 42pt/46pt 'Red Hat Display';letter-spacing:3pt;text-transform:uppercase;white-space:nowrap;overflow:hidden}
  .addr{font:700 15pt/19pt 'Red Hat Display';white-space:nowrap;overflow:hidden}
  .md{font:500 22pt/27pt 'Red Hat Display';white-space:nowrap;overflow:hidden}
  .time{font:500 18pt/23pt 'Red Hat Display';white-space:nowrap;overflow:hidden}
  .vr{position:absolute;width:1pt;background:currentColor;opacity:.6}
  .ev{font:500 10pt/13pt 'Red Hat Display'}
  .oh-agent-name{font-family:'Red Hat Display';font-weight:700}
  .oh-agent{font-family:'Red Hat Display'}
  .fine{font:500 6.6pt/8pt 'Red Hat Display';white-space:nowrap;opacity:.6}
</style>
</head>
<body>
<script id="brochure-data" type="application/json">{}</script>
<div id="pages"></div>
<script>
OHL.start(['700 10pt "Red Hat Display"', '500 10pt "Red Hat Display"'], D => {
  const esc = Ivory.esc, L = D.listing, A = D.agent || {}, C = D.companion || {};
  const E = OHL.event(D), hero = OHL.hero(D, 'straight');
  const rooms = OHL.photos(D).filter(id => id !== hero && !Ivory.fullHouse(D, id));
  let h = '';
  // the logo box where the price was
  h += `<div class="lbox" style="left:396pt;top:30pt;width:186pt;height:74pt"></div>`;
  h += OHL.logo(D, 'light', `left:408pt;top:40pt;width:162pt;height:54pt;justify-content:center`);
  // the house in a white mat, a room overlapping its lower right corner
  const fr = OHL.fitHero(D, hero, 380, 270);
  h += `<div class="mat" style="left:30pt;top:118pt;width:${fr.w + 16}pt;height:${fr.h + 16}pt"></div>`;
  h += OHL.photo(D, hero, `left:38pt;top:126pt;width:${fr.w}pt;height:${fr.h}pt`);
  // a room overlaps the house (the agent's headshot, when shown, is in the agent card)
  const iw = 196, ih = 150, ix = 386, iy = 290;
  h += `<div class="mat" style="left:${ix - 8}pt;top:${iy - 8}pt;width:${iw + 16}pt;height:${ih + 16}pt"></div>`;
  h += OHL.photo(D, rooms[0], `left:${ix}pt;top:${iy}pt;width:${iw}pt;height:${ih}pt`);
  // a row of rooms under
  const evH0 = [E.note, E.refreshments].filter(Boolean).reduce((a, t) => a + Ivory.linesNeeded('ev', t, 540, 13)*13 + 2, 0);
  const gy = 458, gw = (552 - 20)/3, gh = 118 - Math.min(60, evH0 ? evH0 + 8 : 0);
  rooms.slice(1, 4).forEach((id, i) => h += OHL.photo(D, id, `left:${30 + i*(gw+10)}pt;top:${gy}pt;width:${gw}pt;height:${gh}pt`));
  // the band
  const ev = Ivory.eventLines([[E.note,'oh.note','ev'],[E.refreshments,'oh.refreshments','ev']], 36, 0, 540, 13, 2);
  const bt = gy + gh + 16, bh = 792 - bt;
  h += `<div class="band" style="top:${bt}pt;height:${bh}pt"></div>`;
  let y = bt + 14;
  const w = E.label.replace(/\s*open house$/i, '').trim();
  h += `<div class="abs on lab" style="left:36pt;top:${y}pt;width:330pt;height:26pt" data-fit="22,14" data-slot="oh.label" data-lines="1">${esc(E.label)}</div>`;
  h += `<div class="abs on wd" style="left:34pt;top:${y+26}pt;width:330pt;height:46pt" data-fit="42,26" data-slot="oh.weekday" data-lines="1">${esc(E.weekday || '')}</div>`;
  h += `<div class="abs on addr" style="left:36pt;top:${y+76}pt;width:330pt;height:19pt" data-slot="address" data-lines="1">${esc(L.address)}</div>`;
  h += `<div class="vr on" style="left:380pt;top:${y+28}pt;height:62pt"></div>`;
  h += `<div class="abs on md" style="left:396pt;top:${y+30}pt;width:184pt;height:27pt" data-fit="22,18" data-slot="oh.date" data-lines="1">${esc(E.weekday ? E.monthDay : E.long)}</div>`;
  if(E.time) h += `<div class="abs on time" style="left:396pt;top:${y+60}pt;width:184pt;height:23pt" data-fit="18,18" data-slot="oh.time" data-lines="1">${esc(E.time)}</div>`;
  y += 104;
  if(ev.h){ h += ev.html.replace(/top:(\d+(\.\d+)?)pt/g, (m, t) => `top:${+t + y}pt`).replace(/class="abs ev"/g, 'class="abs on ev"'); y += ev.h + 8; }
  // the agent card (the logo is up top)
  h += OHL.contact(D, {x:36, y, w:540, h:62, logo:false, color:'var(--on-main)', nameSize:18, nameFont:"'Red Hat Display'", nameWeight:700, bodyFont:"'Red Hat Display'"});
  y += 64;
  const issues = y > 776 ? [{slot:'oh.note', kind:'overflow', detail:'the band runs off the page'}] : [];
  h += `<div class="abs on fine" style="left:36pt;top:778pt;width:540pt;height:8pt" data-slot="fineprint" data-lines="1" data-fine="1">${esc(C.fineprint || 'Information deemed reliable but not guaranteed.')}</div>`;
  const f = OHL.frame(D, h);
  f.issues = issues;
  return f;
});
</script>
</body>
</html>
