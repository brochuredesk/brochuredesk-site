<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BrochureDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --night:#14120F; --gold:#C9A86A; --gold-soft:#E8D5AE; --paper:#FAF7F2; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse at center, #26211A 0%, var(--night) 70%); color:var(--paper);
         font-family:Figtree, system-ui, sans-serif; display:grid; place-items:center; }
  .stage { position:relative; width:min(80vmin,560px); aspect-ratio:1; display:grid; place-items:center; }
  svg.ring { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:1.5; }
  .ring .track { stroke:rgba(201,168,106,0.15); }
  .ring .bar { stroke:var(--gold); stroke-linecap:round; stroke-dasharray:1000; stroke-dashoffset:1000; }
  .ring .bar.run { animation:sweep 1s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes sweep { to { stroke-dashoffset:0; } }
  .num { font-family:"Playfair Display", Georgia, serif; font-size:min(38vmin,280px); line-height:1; color:var(--gold-soft);
         opacity:0; transform:scale(.6); filter:blur(8px); }
  .num.show { animation:pop 1s ease forwards; }
  @keyframes pop {
    0% { opacity:0; transform:scale(.6); filter:blur(8px); }
    25% { opacity:1; transform:scale(1); filter:blur(0); }
    75% { opacity:1; transform:scale(1.04); filter:blur(0); }
    100% { opacity:0; transform:scale(1.5); filter:blur(6px); }
  }
  .flash { position:fixed; inset:0; background:var(--gold-soft); opacity:0; pointer-events:none; }
  .flash.go { animation:flash .9s ease-out forwards; }
  @keyframes flash { 0% { opacity:.85; } 100% { opacity:0; } }
  .reveal { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px; opacity:0; pointer-events:none; }
  .reveal.on { opacity:1; transition:opacity .6s ease; }
  .kicker { font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold); opacity:0; transform:translateY(12px); }
  .headline { font-family:"Playfair Display", Georgia, serif; font-size:clamp(44px,9vw,104px); line-height:1.05; margin:18px 0 22px;
              background:linear-gradient(100deg, var(--gold) 0%, #FFF3D6 45%, var(--gold) 60%, var(--gold-soft) 100%);
              background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
              opacity:0; transform:translateY(16px); }
  .headline em { font-style:italic; }
  .date { font-size:clamp(18px,2.4vw,24px); letter-spacing:.08em; color:var(--paper); opacity:0; transform:translateY(12px); }
  .rule { width:0; height:1px; background:var(--gold); margin:26px auto 0; }
  .reveal.on .kicker { animation:rise .8s .2s ease forwards; }
  .reveal.on .headline { animation:rise 1s .5s ease forwards, shimmer 4s 1.5s ease-in-out infinite; }
  .reveal.on .date { animation:rise .8s 1s ease forwards; }
  .reveal.on .rule { animation:grow 1.2s 1.3s ease forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  @keyframes grow { to { width:120px; } }
  @keyframes shimmer { 0%,100% { background-position:100% 0; } 50% { background-position:0 0; } }
  .spark { position:fixed; width:4px; height:4px; border-radius:50%; background:var(--gold-soft); opacity:0; pointer-events:none; }
  .corner { position:fixed; right:0; bottom:0; width:96px; height:96px; z-index:10; display:block; background:transparent; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .num, .reveal * { animation-duration:.01s !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="ring" viewBox="0 0 320 320"><circle class="track" cx="160" cy="160" r="150"/><circle class="bar" id="bar" cx="160" cy="160" r="150" pathLength="1000"/></svg>
  <div class="num" id="num">3</div>
</div>
<div class="flash" id="flash"></div>
<a class="corner" href="desk/" aria-hidden="true" tabindex="-1" rel="nofollow"></a>
<div class="reveal" id="reveal">
  <div>
    <div class="kicker">BrochureDesk</div>
    <h1 class="headline">Live by <em>November 1</em></h1>
    <div class="date">2026</div>
    <div class="rule"></div>
  </div>
</div>
<script>
  const num = document.getElementById('num'), bar = document.getElementById('bar');
  function tick(n) {
    num.textContent = n;
    num.classList.remove('show'); bar.classList.remove('run');
    void num.offsetWidth;
    num.classList.add('show'); bar.classList.add('run');
  }
  function sparks() {
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div'); s.className = 'spark'; document.body.appendChild(s);
      const a = Math.random() * Math.PI * 2, d = 150 + Math.random() * 380;
      s.animate([
        { transform:'translate(50vw,50vh) scale(1)', opacity:1 },
        { transform:`translate(calc(50vw + ${Math.cos(a)*d}px), calc(50vh + ${Math.sin(a)*d}px)) scale(0)`, opacity:0 }
      ], { duration:1200 + Math.random()*900, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });
      setTimeout(() => s.remove(), 2400);
    }
  }
  let n = 3; tick(n);
  const timer = setInterval(() => {
    n--;
    if (n > 0) { tick(n); return; }
    clearInterval(timer);
    document.getElementById('stage').style.display = 'none';
    document.getElementById('flash').classList.add('go');
    sparks();
    document.getElementById('reveal').classList.add('on');
  }, 1000);
</script>
</body>
</html>
