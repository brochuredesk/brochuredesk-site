<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BrochureDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --night:#14120F; --gold-soft:#E8D5AE; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; }
  body { background:radial-gradient(ellipse at center, #26211A 0%, var(--night) 70%); color:var(--gold-soft);
         font-family:"Playfair Display", Georgia, serif; display:grid; place-items:center; padding:24px; text-align:center; }
  h1 { font-weight:500; font-size:clamp(44px,9vw,104px); line-height:1.05; }
  .corner { position:fixed; left:0; bottom:0; width:96px; height:96px; z-index:10; display:block; background:transparent; cursor:pointer; }
</style>
</head>
<body>
<h1>hello chris</h1>
<a class="corner" href="desk/" aria-hidden="true" tabindex="-1" rel="nofollow"></a>
</body>
</html>
