<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrochureDesk</title>
<meta name="description" content="Listing brochures and matching marketing, written and designed for you from one listing link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FAF7F2; --ink:#1F1D1A; --muted:#6B655C; --rule:#B89B6E; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:Figtree, system-ui, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  main { max-width:560px; text-align:center; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-weight:500; font-size:clamp(40px,8vw,64px); letter-spacing:-0.01em; }
  .rule { width:56px; height:1px; background:var(--rule); margin:22px auto; }
  p { font-size:18px; line-height:1.6; color:var(--muted); }
  .soon { margin-top:28px; font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>BrochureDesk</h1>
  <div class="rule"></div>
  <p>Paste a listing link. Get a finished brochure and matching marketing, written, designed and sent to your printer.</p>
  <p class="soon">Opening soon in Houston</p>
</main>
</body>
</html>
