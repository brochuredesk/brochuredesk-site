<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test page</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
  :root{--ink:#1d1d1b;--muted:#5f5d58;--line:#e2ded6;--paper:#f6f4ef;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
  header,main{max-width:1240px;margin:0 auto;padding:0 16px}
  header{padding-top:24px}
  h1{font-size:26px;margin:0 0 6px}
  header p{margin:0 0 4px;color:var(--muted);max-width:820px}
  .grp{margin:26px 0}
  .grp h2{font-size:19px;margin:0 0 4px}.grp h2 .n{color:var(--muted);font-weight:400;font-size:15px}
  .note{color:var(--muted);font-size:13.5px;margin:0 0 10px}
  .piece{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
  .piece h3{font-size:16px;margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  .piece h3 .t{font-weight:400;color:var(--muted)}
  .rev{display:inline-block;font:600 11px/1 Figtree,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#666;background:#ececec;border-radius:999px;padding:4px 8px}
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
  figure{margin:0}
  figure img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff}
  figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
  #big{position:fixed;inset:0;background:rgba(20,20,18,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;cursor:zoom-out}
  #big[hidden]{display:none}
  #big img{max-width:100%;max-height:100%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  @media (max-width:560px){ .imgs{grid-template-columns:1fr 1fr;gap:8px} h1{font-size:22px} }
</style>
</head>
<body>
<header>
  <h1 id="g-title">Test page</h1>
  <p id="g-lede"></p>
  <p>Test page, not linked from the site. A gray “In review” tag marks a piece the owner hasn’t approved yet; it never prints. Click a picture to see it full size.</p>
  <p id="g-count"></p>
</header>
<main id="gallery"></main>
<div id="big" hidden><img alt=""></div>
<script src="/preview/gallery.js"></script>
</body>
</html>
